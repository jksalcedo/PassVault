name: Android Release
run-name: Release ${{ github.ref_name }}

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 22
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "22"
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install build-tools (for apksigner)
        run: sdkmanager "build-tools;36.0.0"

      - name: Check Maven Central access (debug)
        run: |
          set -euo pipefail
          curl -I https://repo.maven.apache.org/maven2/ \
            | head -n 1

      - name: Build Release APK (unsigned, retry once on failure)
        run: |
          set -euo pipefail
          chmod +x ./gradlew

          build() {
            ./gradlew --no-parallel --stacktrace assembleRelease
          }

          build || (echo "Gradle failed; retrying in 15s..." && sleep 15 && build)

      - name: Decode signing keys and lineage
        env:
          OLD_KEYSTORE_BASE64: ${{ secrets.OLD_KEYSTORE_BASE64 }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          LINEAGE_BASE64: ${{ secrets.LINEAGE_BASE64 }}
        run: |
          set -euo pipefail
          echo "$OLD_KEYSTORE_BASE64" | base64 -d > "${GITHUB_WORKSPACE}/old-signing.jks"
          echo "$KEYSTORE_BASE64" | base64 -d > "${GITHUB_WORKSPACE}/signing.jks"
          echo "$LINEAGE_BASE64" | base64 -d > "${GITHUB_WORKSPACE}/rotation.lineage"

      - name: Sign APKs with lineage
        env:
          OLD_KEYSTORE_PASSWORD: ${{ secrets.OLD_KEYSTORE_PASSWORD }}
          OLD_KEY_ALIAS: ${{ secrets.OLD_KEY_ALIAS }}
          OLD_KEY_PASSWORD: ${{ secrets.OLD_KEY_PASSWORD }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          APKSIGNER="${ANDROID_HOME}/build-tools/36.0.0/apksigner"

          echo "Listing everything Gradle produced:"
          find app/build/outputs/apk/release -type f -name "*.apk"

          mkdir -p app/build/outputs/apk/signed

          while IFS= read -r -d '' apk; do
            name="$(basename "$apk" .apk)"
            out="app/build/outputs/apk/signed/${name}-signed.apk"
            echo "Signing: $apk -> $out"

            "$APKSIGNER" sign \
              --min-sdk-version 26 \
              --lineage "${GITHUB_WORKSPACE}/rotation.lineage" \
              --ks "${GITHUB_WORKSPACE}/old-signing.jks" \
              --ks-key-alias "${OLD_KEY_ALIAS}" \
              --ks-pass "pass:${OLD_KEYSTORE_PASSWORD}" \
              --key-pass "pass:${OLD_KEY_PASSWORD}" \
              --next-signer \
              --ks "${GITHUB_WORKSPACE}/signing.jks" \
              --ks-key-alias "${KEY_ALIAS}" \
              --ks-pass "pass:${KEYSTORE_PASSWORD}" \
              --key-pass "pass:${KEY_PASSWORD}" \
              --out "$out" \
              "$apk"

            "$APKSIGNER" verify --print-certs "$out"
          done < <(find app/build/outputs/apk/release -type f -iname "*.apk" -print0)

      - name: Generate categorized release notes
        run: |
          set -euo pipefail
          git fetch --tags --force

          TAG="${GITHUB_REF_NAME}"
          PREV_TAG="$(git tag --sort=-creatordate | grep -v "^${TAG}$" | head -n 1 || true)"

          if [[ -n "${PREV_TAG}" ]]; then
            RANGE="${PREV_TAG}..${TAG}"
            echo "Changes since ${PREV_TAG}" >> RELEASE_NOTES.md
          else
            RANGE="${TAG}"
            echo "Initial Release" >> RELEASE_NOTES.md
          fi
          echo "" >> RELEASE_NOTES.md

          git log "${RANGE}" --no-merges --pretty=format:"- %s (%h)" > all_commits.txt

          echo "### Features" >> RELEASE_NOTES.md
          grep -iE "^- feat" all_commits.txt >> RELEASE_NOTES.md || echo "_No new features._" >> RELEASE_NOTES.md
          echo "" >> RELEASE_NOTES.md

          echo "### Bug Fixes" >> RELEASE_NOTES.md
          grep -iE "^- fix" all_commits.txt >> RELEASE_NOTES.md || echo "_No bug fixes._" >> RELEASE_NOTES.md
          echo "" >> RELEASE_NOTES.md

          echo "### Other Changes" >> RELEASE_NOTES.md
          grep -ivE "^- (feat|fix)" all_commits.txt >> RELEASE_NOTES.md || echo "_No other changes._" >> RELEASE_NOTES.md

          rm all_commits.txt
          cat RELEASE_NOTES.md

      - name: Create GitHub Release and upload APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"

          PRERELEASE=false
          if [[ "$TAG" == *alpha* || "$TAG" == *beta* || "$TAG" == *rc* ]]; then
            PRERELEASE=true
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release exists: $TAG"
          else
            gh release create "$TAG" \
              --title "$TAG" \
              --notes-file RELEASE_NOTES.md \
              $( [[ "$PRERELEASE" == "true" ]] && echo "--prerelease" )
          fi

          gh release upload "$TAG" app/build/outputs/apk/signed/*.apk --clobber